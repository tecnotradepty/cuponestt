<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ubicación | TecnoTrade - Mobile Hub</title>
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: rgba(22, 30, 49, 0.7);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-gold: #f59e0b;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-stack);
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1rem;
    }

    .container {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      flex: 1;
    }

    /* Barra Superior de Navegación */
    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--accent-cyan);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .btn-back:hover {
      background: rgba(6, 182, 212, 0.15);
      border-color: var(--accent-cyan);
    }

    .brand-tag {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Tarjeta de Información */
    .info-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
      backdrop-filter: blur(10px);
    }

    .info-card h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 0.25rem;
    }

    .info-card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    .action-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      transition: opacity 0.2s;
    }

    .btn-maps {
      background: var(--accent-cyan);
      color: #041016;
    }

    .btn-whatsapp {
      background: var(--accent-green);
      color: #041016;
    }

    .btn-action:hover {
      opacity: 0.9;
    }

    /* Contenedor del Mapa */
    .map-frame-wrapper {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      flex: 1;
      min-height: 450px;
      position: relative;
    }

    .map-frame-wrapper iframe {
      width: 100%;
      height: 100%;
      min-height: 450px;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <nav class="nav-bar">
      <a href="index.html" class="btn-back">
        <span>←</span> Volver al Catálogo
      </a>
      <span class="brand-tag">TecnoTrade • Mobile Hub</span>
    </nav>

    <section class="info-card">
      <h1>Ubicación del Taller</h1>
      <p>Atención directa en tienda Mobile Hub. Reparaciones en banco de trabajo y recepción de cupones.</p>
      
      <div class="action-links">
        <a href="https://maps.app.goo.gl/UeLwD78YH6QJszY8A" target="_blank" rel="noopener noreferrer" class="btn-action btn-maps">
          Abrir en App de Google Maps
        </a>
        <a href="https://wa.me/50768529324?text=Hola%20TecnoTrade!%20Estoy%20en%20camino%20a%20la%20tienda%20Mobile%20Hub,%20me%20dan%20indicaciones?" target="_blank" rel="noopener noreferrer" class="btn-action btn-whatsapp">
          Consultar llegada por WhatsApp
        </a>
      </div>
    </section>

    <main class="map-frame-wrapper">
      <iframe 
        src="https://maps.google.com/maps?q=Mobile%20Hub%20Panama&t=&z=17&ie=UTF8&iwloc=&output=embed" 
        loading="lazy" 
        allowfullscreen>
      </iframe>
    </main>
  </div>

</body>
</html>
