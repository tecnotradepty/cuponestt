<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TecnoTrade | Cupones & Promociones</title>
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: rgba(22, 30, 49, 0.7);
      --bg-card-hover: rgba(30, 41, 68, 0.9);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-gold: #f59e0b;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-stack);
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.5;
      padding: 1.5rem 1rem 4rem;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Header & Branding */
    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-title {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-main);
      margin-bottom: 0.2rem;
    }

    .brand-subtitle {
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent-cyan);
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .validity-banner {
      display: inline-block;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 0.4rem 1rem;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .store-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .store-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.4rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s;
    }

    .store-link-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Controls */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2.5rem;
      background: var(--bg-card);
      padding: 1.25rem;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      backdrop-filter: blur(10px);
    }

    .search-box input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(11, 15, 25, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent-cyan);
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    .filter-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-right: 0.5rem;
    }

    .filter-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.4rem 0.85rem;
      font-size: 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .filter-btn.active {
      background: var(--accent-cyan);
      border-color: var(--accent-cyan);
      color: #041016;
      font-weight: 700;
    }

    /* Sections */
    .catalog-section {
      margin-bottom: 3.5rem;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.75rem;
    }

    .section-header h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .section-badge {
      background: rgba(6, 182, 212, 0.15);
      color: var(--accent-cyan);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .coupon-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 1.25rem;
    }

    /* Card */
    .coupon-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(8px);
      transition: transform 0.2s, border-color 0.2s;
    }

    .coupon-card:hover {
      transform: translateY(-2px);
      border-color: rgba(6, 182, 212, 0.4);
      background: var(--bg-card-hover);
    }

    .card-top {
      margin-bottom: 1rem;
    }

    .card-badges {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
      font-size: 0.75rem;
    }

    .badge-brand {
      background: rgba(255, 255, 255, 0.08);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .badge-quality {
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      text-transform: uppercase;
      font-size: 0.7rem;
    }

    .quality-incell {
      background: rgba(148, 163, 184, 0.15);
      color: #94a3b8;
      border: 1px solid rgba(148, 163, 184, 0.3);
    }

    .quality-oled {
      background: rgba(6, 182, 212, 0.15);
      color: var(--accent-cyan);
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    .quality-original {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .pricing-container {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      margin-bottom: 1rem;
      background: rgba(0, 0, 0, 0.25);
      padding: 0.75rem;
      border-radius: 8px;
    }

    .price-regular {
      font-size: 0.95rem;
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .price-promo {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent-green);
    }

    .badge-save {
      margin-left: auto;
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }

    .coupon-code-box {
      border: 1px dashed var(--accent-gold);
      background: rgba(245, 158, 11, 0.05);
      border-radius: 6px;
      padding: 0.5rem;
      text-align: center;
      margin-bottom: 0.75rem;
    }

    .coupon-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent-gold);
      display: block;
      font-weight: 700;
    }

    .coupon-code {
      font-family: monospace;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.1em;
    }

    .btn-action {
      background: var(--accent-green);
      color: #041016;
      border: none;
      border-radius: 6px;
      padding: 0.65rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: block;
      transition: opacity 0.2s;
      font-size: 0.9rem;
    }

    .btn-action:hover {
      opacity: 0.9;
    }

    /* Toggle Button */
    .toggle-container {
      display: flex;
      justify-content: center;
      margin-top: 1.5rem;
    }

    .btn-toggle-view {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--accent-cyan);
      padding: 0.6rem 1.4rem;
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }

    .btn-toggle-view:hover {
      background: rgba(6, 182, 212, 0.15);
      border-color: var(--accent-cyan);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="validity-banner">Ofertas válidas del 15 de septiembre al 31 de octubre</div>
      <h1 class="brand-title">TecnoTrade</h1>
      <p class="brand-subtitle">Técnicos de la tienda Mobile Hub</p>
      
      <div class="store-links">
        <a href="https://www.instagram.com/tecnotradepty/" target="_blank" rel="noopener noreferrer" class="store-link-btn">
          Instagram: @tecnotradepty
        </a>
        <a href="https://maps.app.goo.gl/UeLwD78YH6QJszY8A" target="_blank" rel="noopener noreferrer" class="store-link-btn">

    <section class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar por modelo (ej. iPhone 13, Galaxy S23, Pixel 7 Pro)..." />
      </div>

      <div class="filter-group">
        <span class="filter-title">Filtrar Marca:</span>
        <button class="filter-btn active" data-brand="all">Todas</button>
        <button class="filter-btn" data-brand="Apple">Apple</button>
        <button class="filter-btn" data-brand="Samsung">Samsung</button>
        <button class="filter-btn" data-brand="Honor">Honor</button>
        <button class="filter-btn" data-brand="Google">Google</button>
      </div>
    </section>

    <!-- SECCIÓN PANTALLAS -->
    <section class="catalog-section" id="section-pantallas">
      <div class="section-header">
        <h2>Pantallas</h2>
        <span class="section-badge">Instalación Garantizada</span>
      </div>
      <div class="coupon-grid" id="grid-pantallas"></div>
      <div class="toggle-container" id="toggle-container-pantallas"></div>
    </section>

    <!-- SECCIÓN TAPAS TRASERAS -->
    <section class="catalog-section" id="section-tapas">
      <div class="section-header">
        <h2>Tapas Traseras</h2>
        <span class="section-badge">Cierre Hermético</span>
      </div>
      <div class="coupon-grid" id="grid-tapas"></div>
      <div class="toggle-container" id="toggle-container-tapas"></div>
    </section>

    <!-- SECCIÓN BATERÍAS -->
    <section class="catalog-section" id="section-baterias">
      <div class="section-header">
        <h2>Baterías</h2>
        <span class="section-badge">Salud 100%</span>
      </div>
      <div class="coupon-grid" id="grid-baterias"></div>
      <div class="toggle-container" id="toggle-container-baterias"></div>
    </section>
  </div>

  <script>
    const WA_NUMBER = "50768529324";

    const catalog = [
      /* ==================== PANTALLAS ==================== */
      { id: "p-1", category: "Pantallas", brand: "Apple", model: "iPhone X / XS", quality: "OLED", regular: 60, promo: 45, code: "SCRN15" },
      { id: "p-2", category: "Pantallas", brand: "Apple", model: "iPhone 11", quality: "Incell", regular: 40, promo: 30, code: "SCRN10" },
      { id: "p-3", category: "Pantallas", brand: "Apple", model: "iPhone 11 Pro / 11 Pro Max", quality: "OLED", regular: 75, promo: 60, code: "SCRN15" },
      { id: "p-4", category: "Pantallas", brand: "Apple", model: "iPhone 12 / 12 Pro", quality: "Incell", regular: 45, promo: 35, code: "SCRN10" },
      { id: "p-5", category: "Pantallas", brand: "Apple", model: "iPhone 12 / 12 Pro", quality: "OLED", regular: 80, promo: 65, code: "SCRN15" },
      { id: "p-6", category: "Pantallas", brand: "Apple", model: "iPhone 13", quality: "Incell", regular: 50, promo: 38, code: "SCRN12" },
      { id: "p-7", category: "Pantallas", brand: "Apple", model: "iPhone 13", quality: "OLED", regular: 85, promo: 70, code: "SCRN15" },
      { id: "p-8", category: "Pantallas", brand: "Apple", model: "iPhone 13 Pro / 13 Pro Max", quality: "OLED", regular: 110, promo: 90, code: "SCRN20" },
      { id: "p-9", category: "Pantallas", brand: "Apple", model: "iPhone 14 Pro / 14 Pro Max", quality: "OLED", regular: 130, promo: 105, code: "SCRN25" },
      { id: "p-10", category: "Pantallas", brand: "Apple", model: "iPhone 15 Pro / 15 Pro Max", quality: "OLED", regular: 165, promo: 135, code: "SCRN30" },

      { id: "p-11", category: "Pantallas", brand: "Samsung", model: "Galaxy A04 / A05 / A06", quality: "Original", regular: 35, promo: 25, code: "SAM10" },
      { id: "p-12", category: "Pantallas", brand: "Samsung", model: "Galaxy A14 / A15 / A16", quality: "Incell", regular: 42, promo: 30, code: "SAM12" },
      { id: "p-13", category: "Pantallas", brand: "Samsung", model: "Galaxy A34 / A35 / A54 / A55", quality: "OLED", regular: 75, promo: 60, code: "SAM15" },
      { id: "p-14", category: "Pantallas", brand: "Samsung", model: "Galaxy S20 FE / S21 FE", quality: "OLED", regular: 70, promo: 55, code: "SAM15" },
      { id: "p-15", category: "Pantallas", brand: "Samsung", model: "Galaxy S22 Ultra / S23 Ultra", quality: "Incell", regular: 95, promo: 75, code: "SAM20" },
      { id: "p-16", category: "Pantallas", brand: "Samsung", model: "Galaxy S22 Ultra / S23 Ultra", quality: "OLED", regular: 140, promo: 115, code: "SAM25" },

      { id: "p-17", category: "Pantallas", brand: "Honor", model: "Honor X7 / X8 / X9", quality: "Original", regular: 38, promo: 28, code: "HON10" },
      { id: "p-18", category: "Pantallas", brand: "Honor", model: "Honor Magic 5 Lite / 6 Lite", quality: "OLED", regular: 75, promo: 62, code: "HON13" },

      { id: "p-19", category: "Pantallas", brand: "Google", model: "Pixel 6 / 6A / 7", quality: "OLED", regular: 85, promo: 70, code: "PIX15" },
      { id: "p-20", category: "Pantallas", brand: "Google", model: "Pixel 6 Pro", quality: "OLED", regular: 95, promo: 78, code: "PIXPRO17" },
      { id: "p-21", category: "Pantallas", brand: "Google", model: "Pixel 7 Pro", quality: "OLED", regular: 95, promo: 78, code: "PIXPRO17" },
      { id: "p-22", category: "Pantallas", brand: "Google", model: "Pixel 8 Pro", quality: "OLED", regular: 105, promo: 85, code: "PIXPRO20" },

      /* ==================== TAPAS TRASERAS ==================== */
      { id: "t-1", category: "Tapas Traseras", brand: "Apple", model: "iPhone 8 / 8 Plus / X / XR / XS / 11", quality: "Original", regular: 40, promo: 30, code: "TAPA10" },
      { id: "t-2", category: "Tapas Traseras", brand: "Apple", model: "iPhone 11 Pro / 11 Pro Max / 12 mini", quality: "Original", regular: 45, promo: 35, code: "TAPA10" },
      { id: "t-3", category: "Tapas Traseras", brand: "Apple", model: "iPhone 12 / 12 Pro / 12 Pro Max / 13 / 14", quality: "Original", regular: 50, promo: 40, code: "TAPA10" },
      { id: "t-4", category: "Tapas Traseras", brand: "Apple", model: "iPhone 13 Pro / 13 Pro Max / 14 Plus / 14 Pro / 14 Pro Max", quality: "Original", regular: 55, promo: 45, code: "TAPA10" },
      { id: "t-5", category: "Tapas Traseras", brand: "Apple", model: "iPhone 15 / 15 Plus / 15 Pro / 15 Pro Max / 16", quality: "Original", regular: 65, promo: 50, code: "TAPA15" },
      { id: "t-6", category: "Tapas Traseras", brand: "Apple", model: "iPhone 16 Pro / 16 Pro Max", quality: "Original", regular: 75, promo: 60, code: "TAPA15" },

      { id: "t-7", category: "Tapas Traseras", brand: "Samsung", model: "Galaxy S20 / S21 / S22 / S23 / S24 Series", quality: "Original", regular: 45, promo: 32, code: "TAPASAM13" },
      { id: "t-8", category: "Tapas Traseras", brand: "Samsung", model: "Galaxy A14 / A24 / A34 / A54 / A55", quality: "Original", regular: 35, promo: 25, code: "TAPASAM10" },

      { id: "t-9", category: "Tapas Traseras", brand: "Honor", model: "Honor Magic 5 Lite / 6 Lite / 90 / 200", quality: "Original", regular: 40, promo: 28, code: "TAPAHO12" },

      { id: "t-10", category: "Tapas Traseras", brand: "Google", model: "Pixel 6 / 6 Pro / 7 / 7 Pro", quality: "Original", regular: 45, promo: 32, code: "TAPAPIX13" },

      /* ==================== BATERÍAS ==================== */
      { id: "b-1", category: "Baterías", brand: "Apple", model: "iPhone 8 / X / XR / XS / 11", quality: "Original", regular: 35, promo: 25, code: "BAT10" },
      { id: "b-2", category: "Baterías", brand: "Apple", model: "iPhone 12 / 12 Pro / 12 Pro Max", quality: "Original", regular: 55, promo: 40, code: "BATI15" },
      { id: "b-3", category: "Baterías", brand: "Apple", model: "iPhone 13 / 13 Pro / 13 Pro Max", quality: "Original", regular: 60, promo: 45, code: "BATI15" },
      { id: "b-4", category: "Baterías", brand: "Apple", model: "iPhone 14 / 14 Pro / 14 Pro Max", quality: "Original", regular: 65, promo: 48, code: "BATI17" },
      { id: "b-5", category: "Baterías", brand: "Apple", model: "iPhone 15 / 15 Pro / 15 Pro Max", quality: "Original", regular: 70, promo: 50, code: "BATI20" },

      { id: "b-6", category: "Baterías", brand: "Samsung", model: "Galaxy A Series (A10 - A55)", quality: "Original", regular: 38, promo: 26, code: "BATSAM12" },
      { id: "b-7", category: "Baterías", brand: "Samsung", model: "Galaxy S20 / S21 / S22 / S23 Series", quality: "Original", regular: 45, promo: 32, code: "BATSAM13" },
      { id: "b-8", category: "Baterías", brand: "Samsung", model: "Galaxy Z Flip 3 / 4 / 5", quality: "Original", regular: 60, promo: 45, code: "BATFLIP15" },

      { id: "b-9", category: "Baterías", brand: "Honor", model: "Honor Magic Series / X Series", quality: "Original", regular: 38, promo: 27, code: "BATHON11" },

      { id: "b-10", category: "Baterías", brand: "Google", model: "Pixel 6 / 6 Pro / 7 / 7 Pro", quality: "Original", regular: 48, promo: 35, code: "BATPIX13" }
    ];

    let currentBrand = "all";
    let currentSearch = "";

    const expandedSections = {
      "Pantallas": false,
      "Tapas Traseras": false,
      "Baterías": false
    };

    function getQualityClass(quality) {
      if (quality === "Incell") return "quality-incell";
      if (quality === "OLED") return "quality-oled";
      return "quality-original";
    }

    function createCardHTML(item) {
      const savings = item.regular - item.promo;
      const waMsg = encodeURIComponent(`Hola TecnoTrade! Quiero canjear el cupón *${item.code}* para *${item.category}* de *${item.brand} ${item.model}* (Calidad: ${item.quality}) por *$${item.promo}* (Ahorro: $${savings}).`);
      const waUrl = `https://wa.me/${WA_NUMBER}?text=${waMsg}`;

      return `
        <article class="coupon-card">
          <div class="card-top">
            <div class="card-badges">
              <span class="badge-brand">${item.brand}</span>
              <span class="badge-quality ${getQualityClass(item.quality)}">${item.quality}</span>
            </div>
            <h3 class="card-title">${item.model}</h3>
          </div>

          <div>
            <div class="pricing-container">
              <span class="price-regular">$${item.regular}</span>
              <span class="price-promo">$${item.promo}</span>
              <span class="badge-save">AHORRA $${savings}</span>
            </div>

            <div class="coupon-code-box">
              <span class="coupon-label">Código Promocional</span>
              <span class="coupon-code">${item.code}</span>
            </div>

            <a href="${waUrl}" target="_blank" rel="noopener noreferrer" class="btn-action">
              Canjear en WhatsApp
            </a>
          </div>
        </article>
      `;
    }

    function toggleSection(catKey) {
      expandedSections[catKey] = !expandedSections[catKey];
      renderSections();
    }

    function renderSections() {
      const filtered = catalog.filter(item => {
        const matchBrand = currentBrand === "all" || item.brand === currentBrand;
        const matchSearch = currentSearch === "" ||
          item.model.toLowerCase().includes(currentSearch) ||
          item.brand.toLowerCase().includes(currentSearch);
        return matchBrand && matchSearch;
      });

      const categories = [
        { key: "Pantallas", gridId: "grid-pantallas", toggleId: "toggle-container-pantallas" },
        { key: "Tapas Traseras", gridId: "grid-tapas", toggleId: "toggle-container-tapas" },
        { key: "Baterías", gridId: "grid-baterias", toggleId: "toggle-container-baterias" }
      ];

      categories.forEach(cat => {
        const gridEl = document.getElementById(cat.gridId);
        const toggleEl = document.getElementById(cat.toggleId);
        const items = filtered.filter(i => i.category === cat.key);

        if (items.length === 0) {
          gridEl.innerHTML = `<div class="empty-state">No hay promociones disponibles con el filtro actual.</div>`;
          toggleEl.innerHTML = "";
          return;
        }

        const isExpanded = expandedSections[cat.key];
        const isSearchingOrFiltering = currentSearch !== "" || currentBrand !== "all";

        const visibleItems = (isExpanded || isSearchingOrFiltering) ? items : items.slice(0, 3);
        gridEl.innerHTML = visibleItems.map(createCardHTML).join("");

        if (items.length > 3 && !isSearchingOrFiltering) {
          toggleEl.innerHTML = `
            <button class="btn-toggle-view" onclick="toggleSection('${cat.key}')">
              <span>${isExpanded ? "Ocultar modelos" : `Ver todos los modelos (${items.length})`}</span>
              <span>${isExpanded ? "▲" : "▼"}</span>
            </button>
          `;
        } else {
          toggleEl.innerHTML = "";
        }
      });
    }

    // Filtros por marca
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentBrand = btn.getAttribute("data-brand");
        renderSections();
      });
    });

    // Filtro por búsqueda
    document.getElementById("searchInput").addEventListener("input", (e) => {
      currentSearch = e.target.value.trim().toLowerCase();
      renderSections();
    });

    window.toggleSection = toggleSection;

    // Render inicial
    renderSections();
  </script>
</body>
</html>
